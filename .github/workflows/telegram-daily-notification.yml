name: Daily Telegram Notification

on:
  workflow_dispatch:

  schedule:
    - cron: "45 7 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

jobs:
  send-telegram-message:
    name: Send daily Telegram message
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          TRIGGER: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -Eeuo pipefail

          current_date="$(TZ=America/Los_Angeles date '+%A, %B %d, %Y')"
          current_time="$(TZ=America/Los_Angeles date '+%I:%M:%S %p %Z')"

          quotes_file="demo-06-telegram-notification/quotes.txt"

          if [[ ! -f "${quotes_file}" ]]; then
            echo "Error: quotes file not found: ${quotes_file}"
            echo "Current working directory:"
            pwd
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          quote="$(grep -v '^[[:space:]]*$' "${quotes_file}" | shuf -n 1)"

          if [[ -z "${quote}" ]]; then
            echo "Error: no non-empty quote found in ${quotes_file}"
            exit 1
          fi

          repository="${REPOSITORY:-github-actions-demo}"
          branch="${BRANCH:-main}"
          trigger="${TRIGGER:-unknown}"
          run_number="${RUN_NUMBER:-unknown}"

          message="🌅 早上好！今日寄语
          ✅ ${quote}

          📅 ${current_date}
          🕗 ${current_time}

          📦 Repository：${repository}
          🌿 Branch：${branch}
          👤 Trigger：${trigger}
          🔢 Run Number：${run_number}"
        
          echo "Message to send:"
          printf '%s\n' "${message}"

          ./demo-06-telegram-notification/scripts/send-telegram-message.sh "${message}"